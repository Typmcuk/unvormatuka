<div class="card"><h3>📝 Тестирование</h3><div id="tq"></div></div>
<div class="card"><h3>🗂 Карточки заданий</h3><div class="grid" id="cd"></div></div>
<div class="card"><h3>⭐ Рефлексия: как вам урок?</h3><div class="rate">${[[1,"😞 Плохо"],[2,"🙂 Хорошо"],[3,"🤩 Отлично"]].map(([v,t])=>`<button data-f="${v}" class="${p.f==v?"on":""}">${t}</button>`).join(" ")}</div></div>
${me.role=="teacher"?`<div class="card"><h3>✏️ Редактор урока (педагог)</h3><label>Лекция (каждая строка — абзац)<textarea id="e1" style="min-height:140px">${esc(c.lec||"")}</textarea></label>
<label>Ссылка на видео YouTube<input id="e2" value="${esc(c.vid||"")}"></label><label>Тест: по строке на вопрос — «Вопрос|Верный ответ|Неверный|Неверный»<textarea id="e3">${esc(c.tst||"")}</textarea></label><button class="p" id="sv">Сохранить урок</button></div>`:""}`;
$("#bk").onclick=()=>{view="home";go()};
$("#rd").onclick=async()=>{p.r=!p.r;await save();lesson(a)};
a.querySelectorAll("[data-f]").forEach(b=>b.onclick=async()=>{p.f=+b.dataset.f;await save();lesson(a)});
const cs=p.c||(p.c={});$("#cd").innerHTML=CARDS[l.k].map((t,i)=>`<div class="card" style="margin:0"><b>${i+1}. ${esc(t)}</b><br><button data-i="${i}" data-s="want" class="${cs[i]=="want"?"on":""}">Хочу выполнить</button> <button data-i="${i}" data-s="done" class="${cs[i]=="done"?"on":""}">Выполнено ✓</button></div>`).join("");
a.querySelectorAll("[data-i]").forEach(b=>b.onclick=async()=>{const i=b.dataset.i;cs[i]=cs[i]==b.dataset.s?null:b.dataset.s;await save();lesson(a)});
const tq=$("#tq");if(!q.length)tq.innerHTML=`<p class="mu">Тест для этого урока пока не добавлен.</p>`;else{let ok=0,ans=0;
q.forEach((r,qi)=>{const d=document.createElement("div");d.innerHTML=`<b>${qi+1}. ${esc(r[0])}</b>`;[...r.slice(1)].sort(()=>Math.random()-.5).forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=async()=>{if(d.dataset.d)return;d.dataset.d=1;ans++;const g=o==r[1];if(g)ok++;b.classList.add(g?"good":"bad");if(ans==q.length){p.t=Math.round(ok/q.length*100);await save();tq.insertAdjacentHTML("beforeend",`<p><b>Результат: ${ok} из ${q.length} (${p.t}%)</b></p>`)}};d.append(b)});tq.append(d)});
if(p.t!=null)tq.insertAdjacentHTML("afterbegin",`<p class="ok">Последний результат: ${p.t}%. Можно пройти заново.</p>`)}
if($("#sv"))$("#sv").onclick=async()=>{await S.set("les",String(l.n),{lec:$("#e1").value,vid:$("#e2").value,tst:$("#e3").value});lesson(a)}}
async function msgs(a){const all=(await S.all("msg")).sort((x,y)=>x.ts-y.ts);
const mine=me.role=="student"?all.filter(m=>m.from==me.key):me.role=="curator"?all.filter(m=>m.group==me.group):all;
a.innerHTML=`<h2>Обратная связь</h2>${me.role=="student"?`<div class="card"><b>Задать вопрос куратору (гр. ${esc(me.group)})</b><textarea id="mt" placeholder="Ваш вопрос…"></textarea><button class="p" id="ms">Отправить</button></div>`:""}
${mine.length?mine.map(m=>`<div class="card"><div class="msg"><b>${esc(m.fname)}</b> <span class="mu">гр. ${esc(m.group)} · ${new Date(m.ts).toLocaleString("ru-RU")}</span><br>${esc(m.text)}</div>
${m.reply?`<div class="msg rep"><b>${esc(m.rby)}</b><br>${esc(m.reply)}</div>`:me.role!="student"?`<textarea data-r="${m.id}" placeholder="Ответ…"></textarea><button class="p" data-rb="${m.id}">Ответить</button>`:`<p class="mu">Ждём ответа куратора…</p>`}</div>`).join(""):`<p class="mu">Сообщений пока нет.</p>`}`;
if($("#ms"))$("#ms").onclick=async()=>{const t=$("#mt").value.trim();if(!t)return;await S.set("msg",Date.now()+id(me.key).slice(0,6),{from:me.key,fname:me.name,group:me.group,text:t,ts:Date.now()});msgs(a)};
a.querySelectorAll("[data-rb]").forEach(b=>b.onclick=async()=>{const k=b.dataset.rb,t=a.querySelector(`[data-r="${k}"]`).value.trim();if(!t)return;const m=mine.find(x=>x.id==k);const{id:_,...rest}=m;await S.set("msg",k,{...rest,reply:t,rby:me.name,rts:Date.now()});msgs(a)})}
async function panel(a){const acc=(await S.all("acc")).filter(u=>u.role=="student"&&(me.role=="teacher"||u.group==me.group));
const pr=Object.fromEntries((await S.all("prog")).map(p=>[p.id,p]));
const groups=[...new Set(acc.map(u=>u.group))].sort(),f=cache.g||"";const rows=acc.filter(u=>!f||u.group==f);
const st=u=>{const p=pr[u.id]||{},ls=Object.entries(p).filter(([k])=>!k.startsWith("_")),ts=ls.filter(([,v])=>v.t!=null);let w=0,d=0;ls.forEach(([,v])=>Object.values(v.c||{}).forEach(x=>x=="want"?w++:x=="done"?d++:0));
return{ls,ts,w,d,avg:ts.length?Math.round(ts.reduce((s,[,v])=>s+v.t,0)/ts.length):"—",rd:ls.filter(([,v])=>v.r).length}};
a.innerHTML=`<h2>${me.role=="teacher"?"Режим педагога: полный обзор":"Панель куратора, группа "+esc(me.group)}</h2>
${me.role=="teacher"?`<select id="gf"><option value="">Все группы</option>${groups.map(g=>`<option ${g==f?"selected":""}>${esc(g)}</option>`).join("")}</select>`:""}
<div class="card sc"><table><tr><th>Студент</th><th>Группа</th><th>Прочитано</th><th>Тестов</th><th>Ср. балл</th><th>Заданий выполнено</th><th>Хочет выполнить</th></tr>
${rows.map(u=>{const s=st(u);return`<tr><td>${esc(u.name)}</td><td>${esc(u.group)}</td><td>${s.rd}</td><td>${s.ts.length}</td><td>${s.avg}${s.avg!="—"?"%":""}</td><td class="ok">${s.d}</td><td class="wa">${s.w}</td></tr>`}).join("")||`<tr><td class="mu">Студентов пока нет</td></tr>`}</table></div>
${rows.map(u=>{const s=st(u);return`<details class="card"><summary><b>${esc(u.name)}</b> — подробно по урокам</summary><div class="sc"><table><tr><th>Урок</th><th>Тема</th><th>Тест</th><th>Задания</th><th>Оценка урока</th></tr>
${s.ls.sort((x,y)=>x[0]-y[0]).map(([n,v])=>`<tr><td>${n}</td><td style="white-space:normal">${esc(LS[n-1]?.t)}</td><td>${v.t!=null?v.t+"%":"—"}</td><td>${Object.entries(v.c||{}).filter(([,x])=>x).map(([i,x])=>`${+i+1}:${x=="done"?"✓":"хочет"}`).join(" ")||"—"}</td><td>${["—","😞 плохо","🙂 хорошо","🤩 отлично"][v.f||0]}</td></tr>`).join("")||"<tr><td>Нет активности</td></tr>"}</table></div></details>`}).join("")}`;
if($("#gf"))$("#gf").onchange=e=>{cache.g=e.target.value;panel(a)}}
init();
</script></body></html>
